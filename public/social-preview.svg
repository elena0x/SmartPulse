<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SmartPulse healthcare intelligence platform</title>
  <desc id="desc">A dark blue product preview with signal cards, charts, and healthcare intelligence metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#10294a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2678ff"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <linearGradient id="chart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#30c7a6" stop-opacity=".15"/>
      <stop offset="1" stop-color="#30c7a6" stop-opacity=".6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="250" fill="#2678ff" opacity=".08"/>
  <circle cx="140" cy="630" r="280" fill="#30c7a6" opacity=".06"/>

  <g transform="translate(72 64)">
    <rect width="54" height="54" rx="15" fill="url(#brand)"/>
    <path d="M15 31h8l4-14 6 25 4-11h5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="31" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">SmartPulse</text>
    <text x="74" y="52" fill="#92a8c8" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="2">HCP INTELLIGENCE</text>
  </g>

  <g transform="translate(72 184)">
    <text fill="#fff" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700">
      <tspan x="0" dy="0">From fragmented signals</tspan>
      <tspan x="0" dy="58">to focused action.</tspan>
    </text>
    <text x="0" y="146" fill="#aebdd3" font-family="Inter,Arial,sans-serif" font-size="20">
      AI-assisted monitoring, HCP 360° profiles,
    </text>
    <text x="0" y="176" fill="#aebdd3" font-family="Inter,Arial,sans-serif" font-size="20">
      and traceable next-best-action planning.
    </text>
    <g transform="translate(0 220)">
      <rect width="150" height="42" rx="21" fill="#2678ff"/>
      <text x="75" y="27" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">SIGNAL MONITORING</text>
      <rect x="162" width="126" height="42" rx="21" fill="#152f51" stroke="#2e4c70"/>
      <text x="225" y="27" text-anchor="middle" fill="#c5d2e4" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">HCP 360°</text>
      <rect x="300" width="164" height="42" rx="21" fill="#152f51" stroke="#2e4c70"/>
      <text x="382" y="27" text-anchor="middle" fill="#c5d2e4" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600">NEXT BEST ACTION</text>
    </g>
  </g>

  <g transform="translate(640 76)" filter="url(#shadow)">
    <rect width="492" height="478" rx="24" fill="#f8fafc"/>
    <rect width="86" height="478" rx="24" fill="#0a1729"/>
    <rect x="86" width="406" height="70" rx="24" fill="#fff"/>
    <rect x="86" y="46" width="406" height="24" fill="#fff"/>
    <circle cx="43" cy="38" r="18" fill="url(#brand)"/>
    <path d="M32 40h6l4-10 5 18 3-8h5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#5d708c">
      <rect x="25" y="93" width="36" height="6" rx="3"/>
      <rect x="25" y="132" width="28" height="6" rx="3"/>
      <rect x="25" y="171" width="34" height="6" rx="3"/>
      <rect x="25" y="210" width="30" height="6" rx="3"/>
    </g>
    <text x="116" y="34" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Intelligence overview</text>
    <text x="116" y="53" fill="#7b8ba3" font-family="Inter,Arial,sans-serif" font-size="10">Signals · Experts · Recommended actions</text>
    <circle cx="456" cy="34" r="15" fill="#e9eef5"/>

    <g transform="translate(112 94)">
      <rect width="106" height="84" rx="13" fill="#fff" stroke="#e2e8f0"/>
      <text x="14" y="22" fill="#77879c" font-family="Inter,Arial,sans-serif" font-size="10">NEW SIGNALS</text>
      <text x="14" y="53" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">128</text>
      <text x="14" y="72" fill="#20a889" font-family="Inter,Arial,sans-serif" font-size="9">↑ 18% this week</text>
      <rect x="118" width="106" height="84" rx="13" fill="#fff" stroke="#e2e8f0"/>
      <text x="132" y="22" fill="#77879c" font-family="Inter,Arial,sans-serif" font-size="10">HCP COVERAGE</text>
      <text x="132" y="53" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">2.4k</text>
      <text x="132" y="72" fill="#2678ff" font-family="Inter,Arial,sans-serif" font-size="9">42 active segments</text>
      <rect x="236" width="106" height="84" rx="13" fill="#fff" stroke="#e2e8f0"/>
      <text x="250" y="22" fill="#77879c" font-family="Inter,Arial,sans-serif" font-size="10">OPEN ACTIONS</text>
      <text x="250" y="53" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">36</text>
      <text x="250" y="72" fill="#f59e0b" font-family="Inter,Arial,sans-serif" font-size="9">8 high priority</text>
    </g>

    <g transform="translate(112 196)">
      <rect width="220" height="156" rx="13" fill="#fff" stroke="#e2e8f0"/>
      <text x="14" y="24" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Signal velocity</text>
      <path d="M16 116 C42 104 55 110 74 84 S112 100 136 64 S177 76 204 33 L204 130 L16 130Z" fill="url(#chart)"/>
      <path d="M16 116 C42 104 55 110 74 84 S112 100 136 64 S177 76 204 33" fill="none" stroke="#30c7a6" stroke-width="3" stroke-linecap="round"/>
      <g fill="#30c7a6"><circle cx="74" cy="84" r="4"/><circle cx="136" cy="64" r="4"/><circle cx="204" cy="33" r="4"/></g>
      <rect x="232" width="110" height="156" rx="13" fill="#fff" stroke="#e2e8f0"/>
      <text x="246" y="24" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Priority mix</text>
      <circle cx="287" cy="82" r="34" fill="none" stroke="#edf1f6" stroke-width="12"/>
      <path d="M287 48 A34 34 0 0 1 319 94" fill="none" stroke="#2678ff" stroke-width="12" stroke-linecap="round"/>
      <path d="M319 94 A34 34 0 0 1 270 111" fill="none" stroke="#30c7a6" stroke-width="12" stroke-linecap="round"/>
      <text x="287" y="86" text-anchor="middle" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700">72%</text>
      <text x="287" y="138" text-anchor="middle" fill="#77879c" font-family="Inter,Arial,sans-serif" font-size="9">ACTIONABLE</text>
    </g>

    <g transform="translate(112 370)">
      <text x="0" y="13" fill="#17243a" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">Recommended next actions</text>
      <rect y="26" width="342" height="52" rx="12" fill="#f3f7fc"/>
      <circle cx="22" cy="52" r="10" fill="#2678ff" opacity=".14"/>
      <path d="M18 52l3 3 6-7" fill="none" stroke="#2678ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="41" width="174" height="7" rx="3.5" fill="#374c68"/>
      <rect x="42" y="55" width="128" height="6" rx="3" fill="#a9b5c5"/>
      <rect x="284" y="40" width="44" height="22" rx="11" fill="#fff0d5"/>
      <text x="306" y="55" text-anchor="middle" fill="#b46d00" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="700">HIGH</text>
    </g>
  </g>
</svg>
